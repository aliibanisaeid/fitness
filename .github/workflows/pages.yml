name: Publish HARAKAT

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      refresh_research:
        description: Refresh research with gpt-6-luna before publishing
        type: boolean
        default: false
  schedule:
    - cron: '30 5 * * 6' # Saturday 09:00 in Tehran; GitHub may delay scheduled jobs.

permissions:
  contents: read

concurrency:
  group: fitness-pages
  cancel-in-progress: false

jobs:
  research:
    if: github.event_name == 'schedule' || inputs.refresh_research == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Refresh public research briefs
        run: npm run research:weekly
        env:
          GAPGPT_API_KEY: ${{ secrets.GAPGPT_API_KEY }}
          AI_MODEL: gpt-6-luna
          AI_BASE_URL: https://api.gapgpt.app/v1
          ARTICLE_REVIEW_REQUIRED: 'false'
      - name: Save the public snapshot
        run: |
          if ! git diff --quiet -- public/research.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add public/research.json
            git commit -m 'Update weekly rehabilitation research'
            git push
          fi

  build:
    needs: research
    if: always() && !cancelled() && (needs.research.result == 'success' || needs.research.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:pages
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: dist-pages

  deploy:
    needs: build
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
